server {
    listen 80;
    server_name localhost;
    
    # Root directory where Angular build files are stored
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression (optional, makes app faster)
    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        # CRITICAL LINE:
        # Tries to find the file. If not found, returns index.html (Angular)
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (images, js, css) for performance
    location ~* \.(?:ico|css|js|gif|jpe?g|png)$ {
        expires 1y;
        add_header Cache-Control "public";
        access_log off;
    }
}