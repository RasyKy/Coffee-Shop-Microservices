<div *ngIf="authService.currentUser()?.role === 'ADMIN'" class="bg-dark text-white py-2 small">
  <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
    <span>
      <i class="bi bi-shield-lock-fill me-2"></i>
      Admin Account
    </span>
    <div>
      <a routerLink="/admin" class="text-white text-decoration-none fw-bold me-3">
        <i class="bi bi-plus-circle me-1"></i> Admin Dashboard
      </a>
    </div>
  </div>
</div>

<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
  <div class="container-fluid px-4">
    <a class="navbar-brand d-flex align-items-center" routerLink="/">
      <span class="logo-icon">☕</span>
      <span class="logo-text">Brew Haven</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/menu" routerLinkActive="active"> Menu </a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/my-orders" routerLinkActive="active"> Orders </a>
        </li>
      </ul>

      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-icon position-relative" routerLink="/cart">
          <i class="bi bi-cart3"></i>
          <span class="cart-badge" *ngIf="cartService.getItemCount() > 0">
            {{ cartService.getItemCount() }}
          </span>
        </button>

        <div class="dropdown" *ngIf="authService.currentUser()">
          <button
            class="btn btn-icon"
            type="button"
            data-bs-toggle="dropdown"
            aria-expanded="false"
          >
            <i class="bi bi-person-circle"></i>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <span class="dropdown-item-text fw-semibold">
                {{ authService.currentUser().username || authService.currentUser().email }}
              </span>
            </li>

            <li *ngIf="authService.currentUser()?.role === 'ADMIN'">
              <a class="dropdown-item text-primary" routerLink="/admin/add-product">
                <i class="bi bi-gear-fill me-2"></i>Admin Dashboard
              </a>
            </li>

            <li><hr class="dropdown-divider" /></li>
            <li><a class="dropdown-item" routerLink="/my-orders">My Orders</a></li>
            <li><a class="dropdown-item" routerLink="/profile">Profile Settings</a></li>
            <li><hr class="dropdown-divider" /></li>
            <li>
              <button class="dropdown-item text-danger" (click)="logout()">Logout</button>
            </li>
          </ul>
        </div>

        <a routerLink="/login" class="btn btn-icon" *ngIf="!authService.currentUser()">
          <i class="bi bi-person-circle"></i>
        </a>
      </div>
    </div>
  </div>
</nav>
