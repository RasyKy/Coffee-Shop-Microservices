<div class="container py-5">
  <h2 class="mb-4 fw-bold text-primary">My Order History</h2>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

  <!-- Empty State -->
  <div *ngIf="!isLoading && orders.length === 0" class="alert alert-info">
    You haven't ordered any coffee yet! <a href="/menu" class="alert-link">Go to Menu</a>.
  </div>

  <!-- Orders List -->
  <div *ngIf="!isLoading && orders.length > 0">
    <div class="card mb-3 shadow-sm" *ngFor="let order of orders">
      <div class="card-header d-flex justify-content-between align-items-center bg-white">
        <strong>Order #{{ order.orderNumber.substring(0, 8) }}...</strong>
        <!-- If your backend sends a createdDate, use it here. e.g. {{ order.id.date | date }} for Mongo IDs -->
        <span class="badge bg-success">Confirmed</span>
      </div>
      <div class="card-body">
        <ul class="list-group list-group-flush">
          <li class="list-group-item d-flex justify-content-between align-items-center" 
              *ngFor="let item of order.orderLineItemsList">
             <div>
               <span class="fw-bold">{{ item.skuCode }}</span> 
               <span class="text-muted ms-2">x {{ item.quantity }}</span>
             </div>
             <span>${{ item.price }}</span>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
