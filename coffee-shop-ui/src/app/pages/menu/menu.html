<div class="container py-5">
  <h1 class="text-center mb-5 fw-bold text-primary">Our Coffee Selection</h1>

  <!-- Order Status Notification -->
  <div
    *ngIf="orderStatus"
    class="alert alert-dismissible fade show fixed-top m-3 shadow-lg"
    [ngClass]="orderStatus.type === 'success' ? 'alert-success' : 'alert-danger'"
    style="z-index: 1050; max-width: 400px; left: 50%; transform: translateX(-50%)"
  >
    <strong>{{ orderStatus.type === 'success' ? 'Success!' : 'Error!' }}</strong>
    {{ orderStatus.message }}
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="text-center">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Product Grid -->
  <div class="row row-cols-1 row-cols-md-3 g-4" *ngIf="!isLoading">
    <div class="col" *ngFor="let product of products">
      <div class="card h-100 shadow-sm border-0">
        <!-- Placeholder image if you don't have URLs yet -->
        <div
          class="card-img-top bg-light d-flex align-items-center justify-content-center"
          style="height: 200px"
        >
          <span class="fs-1">☕</span>
        </div>

        <div class="card-body">
          <h5 class="card-title fw-bold">{{ product.name }}</h5>
          <p class="card-text text-muted">{{ product.description }}</p>
          <h5 class="text-primary fw-bold">${{ product.price }}</h5>
        </div>

        <div class="card-footer bg-white border-top-0 pb-3">
          <button class="btn btn-outline-primary w-100" (click)="quickOrder(product)">
            Quick Order
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
