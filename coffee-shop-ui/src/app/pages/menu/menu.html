<div class="container py-5">
  <h1 class="text-center mb-4 fw-bold text-primary">Our Product Selection</h1>

  <div class="row justify-content-center mb-5">
    <div class="col-md-8">
      <div class="card p-3 shadow-sm border-0 bg-light">
        <div class="row g-3">
          <div class="col-md-8">
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0">
                <i class="bi bi-search text-muted"></i>
              </span>
              <input
                type="text"
                class="form-control border-start-0 ps-0"
                placeholder="Search for coffee, pastries..."
                [(ngModel)]="searchQuery"
                (input)="onFilterChange()"
              />
            </div>
          </div>

          <div class="col-md-4">
            <select class="form-select" [(ngModel)]="selectedCategory" (change)="onFilterChange()">
              <option *ngFor="let cat of categories" [value]="cat">
                {{ cat }}
              </option>
            </select>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="!isLoading && filteredProducts.length === 0" class="text-center py-5">
    <i class="bi bi-cup-hot display-1 text-muted"></i>
    <h3 class="mt-3 text-muted">No products found</h3>
    <p>Try adjusting your search or category.</p>
    <button
      class="btn btn-outline-primary"
      (click)="searchQuery = ''; selectedCategory = 'All'; onFilterChange()"
    >
      Clear Filters
    </button>
  </div>

  <div class="row row-cols-1 row-cols-md-3 g-4" *ngIf="!isLoading && filteredProducts.length > 0">
    <div class="col" *ngFor="let product of filteredProducts">
      <div class="card h-100 shadow-sm border-0 product-card">
        <div class="position-relative overflow-hidden">
          <img
            class="card-img-top object-fit-cover"
            [src]="product.imageUrl || '/assets/fallback.png'"
            (error)="product.imageUrl = '/assets/fallback.png'"
            alt="{{ product.name }}"
            style="height: 220px; transition: transform 0.3s"
          />
          <span class="badge bg-dark position-absolute top-0 end-0 m-2 opacity-75">
            {{ product.category }}
          </span>
        </div>

        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <h5 class="card-title fw-bold mb-0">{{ product.name }}</h5>
            <h5 class="text-primary fw-bold mb-0">${{ product.price }}</h5>
          </div>
          <p class="card-text text-muted small">
            {{ product.description }}
          </p>
        </div>

        <div class="card-footer bg-white border-top-0 pb-3 pt-0">
          <button
            class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2"
            (click)="addToCart(product)"
          >
            <i class="bi bi-cart-plus"></i> Add to Cart
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
