<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow border-0">
        <div class="card-header bg-primary text-white p-3">
          <h3 class="mb-0 fs-4">Edit Product</h3>
        </div>

        <div class="card-body p-4">
          <div *ngIf="isLoading" class="text-center py-5">
            <div class="spinner-border text-primary" role="status"></div>
          </div>

          <form *ngIf="!isLoading" [formGroup]="editForm" (ngSubmit)="onSubmit()">
            <div class="mb-3">
              <label class="form-label fw-bold">Product Name</label>
              <input
                type="text"
                class="form-control"
                formControlName="name"
                [class.is-invalid]="editForm.get('name')?.invalid && editForm.get('name')?.touched"
              />
              <div class="invalid-feedback">Name is required.</div>
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Description</label>
              <textarea
                class="form-control"
                rows="3"
                formControlName="description"
                [class.is-invalid]="
                  editForm.get('description')?.invalid && editForm.get('description')?.touched
                "
              ></textarea>
              <div class="invalid-feedback">Description is required.</div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label fw-bold">Price ($)</label>
                <input
                  type="number"
                  class="form-control"
                  formControlName="price"
                  step="0.10"
                  [class.is-invalid]="
                    editForm.get('price')?.invalid && editForm.get('price')?.touched
                  "
                />
                <div class="invalid-feedback">Price must be > 0.</div>
              </div>

              <div class="col-md-6">
                <label class="form-label fw-bold">Category</label>
                <select
                  class="form-select"
                  formControlName="category"
                  [class.is-invalid]="
                    editForm.get('category')?.invalid && editForm.get('category')?.touched
                  "
                >
                  <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
                </select>
                <div class="invalid-feedback">Category is required.</div>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold">Product Image</label>

              <input
                type="file"
                class="form-control mb-3"
                accept="image/*"
                (change)="onFileChange($event)"
              />
              <input type="hidden" formControlName="imageUrl" />

              <div *ngIf="imagePreview" class="text-center p-3 bg-light border rounded">
                <p class="small text-muted mb-2">Current Image Preview:</p>
                <img
                  [src]="imagePreview"
                  alt="Preview"
                  class="img-fluid rounded shadow-sm"
                  style="max-height: 200px"
                />
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold">Status</label>
              <select class="form-select" formControlName="status">
                <option *ngFor="let stat of statuses" [value]="stat">{{ stat }}</option>
              </select>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
              <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
                <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
                Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
