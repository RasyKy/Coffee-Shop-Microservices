<div class="container-fluid py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="mb-0">Product Management</h2>
    <button class="btn btn-dark" (click)="openModal(null)">+ Add Product</button>
  </div>

  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <div *ngIf="!isLoading" class="table-responsive">
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>Image</th>
          <th>Name</th>
          <th>Price</th>
          <th>Category</th>
          <th>Status</th>
          <th class="text-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let product of products">
          <td>
            <img
              [src]="product.imageUrl || 'assets/placeholder.png'"
              [alt]="product.name"
              class="product-image"
              style="width: 60px; height: 60px; object-fit: cover; border-radius: 8px"
            />
          </td>
          <td>{{ product.name }}</td>
          <td>${{ product.price }}</td>
          <td>{{ product.category }}</td>
          <td>
            <span class="badge" [ngClass]="product.active ? 'bg-success' : 'bg-secondary'">
              {{ product.active ? 'Active' : 'Inactive' }}
            </span>
          </td>
          <td class="text-center">
            <button
              class="btn btn-sm btn-outline-primary me-2"
              (click)="openModal(product)"
              title="Edit Product"
            >
              <i class="bi bi-pencil"></i>
            </button>
            <button
              class="btn btn-sm btn-outline-danger"
              (click)="deleteProduct(product.id!, product.name)"
              title="Delete Product"
            >
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="products.length === 0" class="text-center py-5 text-muted">
      <p>No products found. Click "Add Product" to create one.</p>
    </div>
  </div>

  <app-product-form-modal
    *ngIf="showModal"
    [product]="selectedProduct"
    (save)="handleSave($event)"
    (close)="closeModal()"
  ></app-product-form-modal>
</div>
